# A difference is a break only when it clears BOTH the absolute floor (in rands) and the percentage.

price_recon:
  # Independent vendors reporting the same official close should agree to the cent.
  yahoo_vs_eodhd:
    close: { abs_floor_zar: 0.01, rel_pct: 0.05 }
  yahoo_vs_afx:
    close: { abs_floor_zar: 0.01, rel_pct: 0.05 }
  eodhd_vs_afx:
    close: { abs_floor_zar: 0.01, rel_pct: 0.05 }

  # Same vendor, consecutive snapshots: history should not move, so any change is a restatement.
  yahoo_restatement:
    close:     { abs_floor_zar: 0.01, rel_pct: 0.01 }
    adj_close: { abs_floor_zar: 0.01, rel_pct: 0.01 }

holdings_recon:
  easyequities_vs_internal:
    # The export has no quantity column, so quantity is implied from value and tested in rands, not shares.
    position_value: { abs_floor_zar: 1.00, rel_pct: 0.10 }
    price: { abs_floor_zar: 0.01, rel_pct: 0.05 }
    settlement_days: 3  # JSE equities settle T+3

# Data quality rules that are not variance checks.
dq:
  stale_price_days: 5        # identical close for N consecutive trading days
  unit_ratio_band: [80, 125]  # ~100x off both neighbours; wide enough to allow a real price move on the day
  timing_clear_days: 2       # breaks that clear within N days are TIMING
