name: ingest

# Daily end-of-day snapshot, committed to the snapshots branch because runners keep nothing between jobs.

on:
  schedule:
    - cron: "30 16 * * 1-5"  # 18:30 SAST on weekdays, an hour after the JSE close
  workflow_dispatch:
    inputs:
      period:
        description: Vendor lookback
        type: choice
        options: [3mo, 1y, 5y, max]
        default: 3mo
      refetch:
        description: Replace today's snapshot if it already exists
        type: boolean
        default: false
      dry_run:
        description: Fetch and report coverage, but commit nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest  # two runs pushing to the snapshots branch at once would race
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check out snapshots into data/landing
        uses: actions/checkout@v5
        with:
          ref: snapshots
          path: data/landing

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Verify existing snapshots  # loading re-checks every snapshot against its manifest hash
        run: python -m src.rebuild

      - name: Take snapshot  # inputs pass through env, so a crafted input cannot inject shell
        shell: bash
        env:
          PERIOD: ${{ inputs.period || '3mo' }}
          REFETCH: ${{ inputs.refetch && '--refetch' || '' }}
        run: python -m src.ingest --period "$PERIOD" --min-coverage 0.95 $REFETCH 2>&1 | tee ingest.log

      - name: Data quality
        shell: bash
        run: python -m src.staging 2>&1 | tee dq.log

      - name: Commit snapshot
        if: ${{ !inputs.dry_run }}
        working-directory: data/landing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot already recorded; nothing to commit."
            exit 0
          fi
          git commit -m "yahoo snapshot $(TZ=Africa/Johannesburg date +%F)"
          git push origin snapshots

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Ingest"
            echo '```'
            cat ingest.log 2>/dev/null || echo "Snapshot step did not run."
            echo '```'
            echo "### Data quality"
            echo '```'
            cat dq.log 2>/dev/null || echo "Data quality step did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
