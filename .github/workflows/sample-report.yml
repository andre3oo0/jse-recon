name: sample-report

# Rebuilds the SYNTHETIC sample report, recalculated in LibreOffice so its figures show in any viewer, and commits it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build, recalculate and check
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc > /dev/null
          python -m src.demo --check

      - name: Commit the sample report
        shell: bash
        run: |
          git config user.name "andre3oo0"
          git config user.email "140933797+andre3oo0@users.noreply.github.com"
          git add docs/sample/break_report_SYNTHETIC.xlsx
          if git diff --cached --quiet; then
            echo "Sample report unchanged."
            exit 0
          fi
          git commit -m "Rebuild the synthetic sample report"
          git push origin HEAD:main
