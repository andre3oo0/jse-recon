# Vendor settings; sources with a daily_batch rotate through the universe, least recently tried first.
yahoo:
  suffix: ".JO"
  period: 3mo

eodhd:
  suffix: ".JSE"
  period: 1y  # the free plan's full history, so each rotated fetch overlaps the others
  daily_batch: 18  # the free plan allows 20 calls a day; two spare for retries
  assumed_unit: ZAc  # not reported by the API; ABG.JSE closed 21743.0 on 2026-09-28, the same as Yahoo's 21743 ZAc

afx:
  url: "https://afx.kwayisi.org/jse/{code}.html"
  period: 10d  # each page shows the last ten sessions
  daily_batch: 22
  crawl_delay_seconds: 60  # asked for by the site's robots.txt

recon_pairs:
  - [yahoo, eodhd]
  - [yahoo, afx]
  - [eodhd, afx]
