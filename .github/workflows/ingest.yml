name: ingest

# Daily end-of-day snapshot, committed to the snapshots branch because runners keep nothing between jobs.

on:
  schedule:
    - cron: "30 16 * * 1-5"  # 18:30 SAST on weekdays, an hour after the JSE close
  workflow_dispatch:
    inputs:
      period:
        description: Vendor lookback
        type: choice
        options: [3mo, 1y, 5y, max]
        default: 3mo
      refetch:
        description: Replace today's snapshot if it already exists
        type: boolean
        default: false
      dry_run:
        description: Fetch and report coverage, but commit nothing
        type: boolean
        default: false
      batch:
        description: Securities per rotated source (EODHD, AFX); blank for the configured daily batch
        type: string
        default: ""
      sources:
        description: Comma-separated sources to fetch, e.g. afx; blank for all
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ingest  # two runs pushing to the snapshots branch at once would race
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check out snapshots into data/landing
        uses: actions/checkout@v5
        with:
          ref: snapshots
          path: data/landing

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Verify existing snapshots  # loading re-checks every snapshot against its manifest hash
        run: python -m src.rebuild

      - name: Yahoo snapshot  # inputs pass through env, so a crafted input cannot inject shell
        if: ${{ !cancelled() && (inputs.sources == '' || inputs.sources == null || contains(inputs.sources, 'yahoo')) }}
        shell: bash
        env:
          PERIOD: ${{ inputs.period || '3mo' }}
          REFETCH: ${{ inputs.refetch && '--refetch' || '' }}
        run: python -m src.ingest --source yahoo --period "$PERIOD" --min-coverage 0.95 $REFETCH 2>&1 | tee -a ingest.log

      - name: EODHD snapshot
        if: ${{ !cancelled() && (inputs.sources == '' || inputs.sources == null || contains(inputs.sources, 'eodhd')) }}
        shell: bash
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          REFETCH: ${{ inputs.refetch && '--refetch' || '' }}
          BATCH: ${{ inputs.batch }}
        run: python -m src.ingest --source eodhd --min-coverage 0.8 $REFETCH ${BATCH:+--batch "$BATCH"} 2>&1 | tee -a ingest.log

      - name: AFX snapshot  # on request only: the site drops connections from cloud runners, so it runs locally
        if: ${{ !cancelled() && contains(inputs.sources, 'afx') }}
        timeout-minutes: 35  # a hung site fails this step, not the job, so the other snapshots still commit
        shell: bash
        env:
          REFETCH: ${{ inputs.refetch && '--refetch' || '' }}
          BATCH: ${{ inputs.batch }}
        run: python -m src.ingest --source afx --min-coverage 0.8 $REFETCH ${BATCH:+--batch "$BATCH"} 2>&1 | tee -a ingest.log

      - name: Commit snapshots  # runs even if one source failed, so the others are never lost
        if: ${{ !cancelled() && !inputs.dry_run }}
        working-directory: data/landing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshots already recorded; nothing to commit."
            exit 0
          fi
          landed=$(git diff --cached --name-only | cut -d/ -f1 | sort -u | paste -sd, -)
          git commit -m "snapshots $(TZ=Africa/Johannesburg date +%F): $landed"
          git push origin snapshots

      - name: Data quality  # after the commit, so a failing report can never cost a snapshot
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m src.staging --report-only 2>&1 | tee dq.log

      - name: Reconcile
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m src.recon 2>&1 | tee recon.log

      - name: Answers
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m src.answers 2>&1 | tee answers.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Answers"
            echo '```'
            cat answers.log 2>/dev/null || echo "Answers step did not run."
            echo '```'
            echo "### Ingest"
            echo '```'
            cat ingest.log 2>/dev/null || echo "Snapshot step did not run."
            echo '```'
            echo "### Data quality"
            echo '```'
            cat dq.log 2>/dev/null || echo "Data quality step did not run."
            echo '```'
            echo "### Reconciliation"
            echo '```'
            cat recon.log 2>/dev/null || echo "Reconciliation step did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
